# StructureTemplate internals used by the incremental village construction system
# (StructureInProgress / InstantBuildStructure). Replaces the old reflection hack:
# these are compile-checked, so a Minecraft update that changes them breaks the
# build instead of silently failing at runtime.
public net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate palettes
public net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate entityInfoList
public net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate size
public net.minecraft.world.level.levelgen.structure.templatesystem.StructureTemplate addEntitiesToWorld(Lnet/minecraft/world/level/ServerLevelAccessor;Lnet/minecraft/core/BlockPos;Lnet/minecraft/world/level/levelgen/structure/templatesystem/StructurePlaceSettings;)V

# A companion pet's collar colour is set through the vanilla setter, which is
# private on both Wolf and Cat (CompanionPets sets a pet's collar on spawn and
# again from the owner's chosen colour). Publicized so it is compile-checked.
public net.minecraft.world.entity.animal.Wolf setCollarColor(Lnet/minecraft/world/item/DyeColor;)V
public net.minecraft.world.entity.animal.Cat setCollarColor(Lnet/minecraft/world/item/DyeColor;)V
