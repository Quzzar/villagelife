plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '1.0.21'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    // Curios API, for the optional accessory-slot integration.
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
        content { includeGroup 'top.theillusivec4.curios' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // UI preview: ./gradlew runClient -Puipreview=trade photographs the
            // villager screen and quits (see client/gui/UiPreview.java). It must
            // be forwarded explicitly, because -D lands on Gradle's own JVM and
            // never reaches the forked client.
            systemProperty 'villagelife.uipreview', (findProperty('uipreview') ?: '')
        }

        // Boots straight onto the local dev server: the headless test loop uses this to put
        // a real player online (gift attribution and Hero of the Village need one).
        clientJoinLocal {
            client()
            programArguments.addAll '--quickPlayMultiplayer', 'localhost:25565'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // The UI preview needs a real player now that the screen is a
            // container, so it runs on the join-local configuration.
            systemProperty 'villagelife.uipreview', (findProperty('uipreview') ?: '')
            // Its OWN game directory. Sharing run/ with a live dev server puts
            // two processes on one config file, and they correct each other's
            // corrections forever: the client never finishes connecting and the
            // log fills with "is not correct. Correcting" twice a second.
            gameDirectory = project.file('run-preview')
            // Drives a real trade end to end and asserts what it cost, so
            // trading bugs stop being found by handing the game back to Aaron.
            systemProperty 'villagelife.uitest', (findProperty('uitest') ?: '')
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // NOTE: no Jlama JVM flags here on purpose. The LLM runs in a worker
            // process that bakes its own flags in (see LlmWorkerLauncher), and dev
            // runs should match what players get.

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime

    // Jlama jars that must live in ONE module: jlama-core and jlama-native share
    // the com.github.tjake.jlama.tensor.operations package, which is a split
    // package under FML's module system — as two separate jars the native ops
    // are unreachable and Jlama silently falls back to a code path that crashes
    // on ARM. Merged into the mod jar for production and into a bundle jar for
    // dev runs. osx-x86_64 stays excluded: both mac jars store their lib at the
    // same resource path, and merging would keep an arbitrary one.
    jlamaBundle {
        transitive = false
        canBeConsumed = false
    }

    // Libraries the LLM worker process needs but Minecraft already provides to
    // the game JVM. They must NOT go through jarJar (FML would load them next
    // to Minecraft's own copies); instead they ride along as plain files under
    // META-INF/workerlibs/, invisible to FML, extracted only for the worker's
    // classpath (see LlmWorkerLauncher).
    workerOnlyLibs {
        transitive = false
        canBeConsumed = false
    }
}

// Merges the Jlama jars into a single flat jar (see the jlamaBundle
// configuration for why they cannot stay separate). META-INF/versions/21 is
// flattened into the root — FML's jar handling does not surface multi-release
// entries, and the Java 21 classes are the ones a 1.21.1 runtime needs. The
// versions/21 tree is added before the jar root so its real implementations
// win over the root's pre-Java-20 stubs (e.g. MemorySegmentSupport).
def shadeJlama = { task ->
    task.duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    configurations.jlamaBundle.each { jarFile ->
        task.from(zipTree(jarFile)) {
            include 'META-INF/versions/21/**'
            includeEmptyDirs = false
            eachFile { fcd -> fcd.path = fcd.path.replaceFirst('META-INF/versions/21/', '') }
        }
        task.from(zipTree(jarFile)) {
            exclude 'META-INF/MANIFEST.MF', 'META-INF/INDEX.LIST', 'META-INF/versions/**',
                    'META-INF/maven/**', 'module-info.class'
        }
    }
}

// Standalone merged jar for dev runs (the production mod jar gets the same
// content shaded in directly).
def jlamaBundleJar = tasks.register('jlamaBundleJar', Jar) {
    archiveBaseName = 'jlama-bundle'
    archiveVersion = jlama_version
    destinationDirectory = layout.buildDirectory.dir('jlama')
    shadeJlama(it)
}

tasks.named('jar', Jar) {
    shadeJlama(it)
    from(configurations.workerOnlyLibs) {
        into 'META-INF/workerlibs'
    }
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Jlama: pure-Java LLM inference engine used for villager decision-making.
    // The game JVM NEVER runs Jlama — only the LLM worker child process does —
    // so jlama-core is compile-only for the parent. At runtime the worker gets
    // Jlama from the shaded mod jar (prod) / the jlamaBundle jar (dev).
    compileOnly "com.github.tjake:jlama-core:${jlama_version}"

    // Curios API only, never the mod: villagers notice and use accessory slots
    // when a Curios-backed mod is installed, and behave normally when it is not
    // (see AccessoryCompat). localRuntime so dev runs can exercise the path
    // without publishing a dependency on it.
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"

    jlamaBundle "com.github.tjake:jlama-core:${jlama_version}"
    jlamaBundle "com.github.tjake:jlama-native:${jlama_version}:linux-x86_64"
    jlamaBundle "com.github.tjake:jlama-native:${jlama_version}:osx-aarch_64"
    jlamaBundle "com.github.tjake:jlama-native:${jlama_version}:windows-x86_64"

    // Dev-run supply line for the LLM worker child process. localRuntime lands
    // on the dev JVM's java.class.path, which the worker inherits (see
    // LlmWorkerLauncher). jlama-core here exists ONLY to pull its library
    // transitives (Jackson, jinjava, guava, slf4j, ...) onto that path; the
    // launcher puts the bundle jar FIRST on the child classpath so the plain
    // jlama-core jar (no natives) never shadows the shaded one.
    localRuntime "com.github.tjake:jlama-core:${jlama_version}"
    localRuntime "org.slf4j:slf4j-simple:2.0.9"
    localRuntime files(tasks.named('jlamaBundleJar'))

    workerOnlyLibs "org.slf4j:slf4j-api:2.0.9"
    workerOnlyLibs "org.slf4j:slf4j-simple:2.0.9"
    workerOnlyLibs "com.google.guava:guava:32.1.2-jre"
    workerOnlyLibs "com.google.guava:failureaccess:1.0.1"
    workerOnlyLibs "org.apache.commons:commons-lang3:3.14.0"

    // jarJar does not embed transitive dependencies, so Jlama's runtime deps are
    // listed explicitly. Guava, slf4j-api, and commons-lang3 are omitted because
    // Minecraft/NeoForge already provide them at runtime.
    def jlamaRuntimeLibs = [
            "com.fasterxml.jackson.core:jackson-databind:2.17.1",
            "com.fasterxml.jackson.core:jackson-core:2.17.1",
            "com.fasterxml.jackson.core:jackson-annotations:2.17.1",
            "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.17.1",
            "org.yaml:snakeyaml:2.2",
            "org.jctools:jctools-core:4.0.1",
            "com.hubspot.jinjava:jinjava:2.7.2",
            "org.javassist:javassist:3.24.1-GA",
            "com.google.re2j:re2j:1.2",
            "commons-net:commons-net:3.9.0",
            "com.googlecode.java-ipv6:java-ipv6:0.17",
            "ch.obermuhlner:big-math:2.0.0",
            "net.fellbaum:jemoji:1.4.1",
            "net.jafama:jafama:2.3.2",
    ]
    jlamaRuntimeLibs.each { lib -> jarJar(lib) }

    // The transitive deps also go on the dev-run classpath, pinned to the same
    // versions that get embedded, so dev and the release jar resolve identically
    // (jlama-core alone would pull an older Jackson transitively).
    jlamaRuntimeLibs.each { lib -> additionalRuntimeClasspath(lib) }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
